  intro: 张骁，中国人民大学高瓴人工智能学院预聘副教授，博导，中国人民大学人工智能治理研究院研究员。已在本领域相关的国内外学术期刊和会议上发表论文六十余篇，涵盖TPAMI、ICML、NeurIPS、ICLR、KDD、SIGIR、ACL、TOIS、TKDE、WWW 等 CCF A 类期刊会议，并获得 SIGIR 2024 最佳短文提名奖、VLDB 2024 最佳论文提名奖、SIGIR-AP 2024 最佳论文奖, WWW 2023 最佳论文提名奖、SIGIR-AP 2023 最佳论文奖、ICPR 2018 最佳论文奖、CCFAI 2017 最佳论文提名奖、CCDM 2016 最佳论文奖。受邀担任 ICLR、ACL、SIGIR等多个国际会议的领域主席。主持科研基金项目十余项，包括：科技部人工智能重大专项子课题、国家自然科学基金（面上项目、青年基金项目）、中国科协高端科技创新智库青年项目、中国博士后科学基金特别资助、以及腾讯微信犀牛鸟专项研究计划等。
